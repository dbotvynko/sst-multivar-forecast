# @package _global_
#
# GloFM-style flow matching for SST+SLA (Garcia et al., VISAPP 2026)
# adapted to the global SST+SLA end-to-end forecast setup.
#
# Key differences from other FM variants:
#   - UNCONDITIONAL training: FM learns p(SST, SLA) from clean GLORYS data
#     without any conditioning signal — no pre-trained frozen model needed!
#   - Logit-normal timestep sampling: z~N(0,1), s=sigmoid(z)
#     → denser steps around s=0.5, downweights extremes
#   - MMPS at inference: gradient-based posterior conditioning on sparse obs
#     (past SST L3 + past SLA L3) — no concatenation, pure gradient guidance
#   - EMA (decay=0.999) for stable generation
#   - Heun's 2nd-order ODE + non-uniform schedule at inference
#
# Architecture: FlowMatchingVelocityUNetUnconditional
#   Input:  x_t (58 ch = 29 SST + 29 SLA) only
#   Output: velocity (58 ch)
#   Self-attention at coarsest UNet resolution
#
# Posterior conditioning (MMPS at inference):
#   ∇_xs log p(y|xs) ≈ obs_mask * (y - E[x1|xs]) / (σ_y² + (1-s)²)

paths:
    masks_path: /Odyssey/public/glorys/obs_masks/global_obs_6sats_masks_2022.pickle
    glorys12_data: /Odyssey/public/ODYSSEA_IFREMER_SST/CLIMATO/SST-L3-NRT-2010_2019_NRT_ANOMALY_CLIMATO_f32_0.25deg_grid_sla_unfiltered.nc
    full_l4_path: /Odyssey/public/ODYSSEA_IFREMER_SST/L4/SST-L4-2010_2020_ANOMALY_CLIMATO_f32_0.25deg_pyresample_analysed_sst_grid_from_sla_unfiltered.nc
    sla_l3_path: /Odyssey/public/altimetry_traces/2010_2019/gridded_0.25deg/sla_unfiltered_0.25deg.nc
    sla_l4_path: /Odyssey/public/duacs/2010_2019/duacs_2010_2019_0.25deg_float32.nc
    ref_data_l4: ""
    ose_data_paths: ""

var_name: "sst_anomaly"
year_ose: 2023

domain:
  train:
    lat:
      _target_: builtins.slice
      _args_: [-80, 80]
    lon:
      _target_: builtins.slice
      _args_: [-180, 180]
  test:
    lat:
      _target_: builtins.slice
      _args_: [-80, 80]
    lon:
      _target_: builtins.slice
      _args_: [-180, 180]

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 2
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_SST_ODYSSEA_UNet_ResBlock_17M_2010_2019_FLOW_MATCHING_GLOFM_SST_SLA_2gpu_uncond_mmps
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 300
  limit_train_batches: 500
  callbacks:
    - _target_: src.versioning_cb.VersioningCallback
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_loss
      save_top_k: 10
      filename: '{val_loss:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.moving_patches.movpatch_data_tests.MovingPatchDataModuleFastRecGPU_SST_SLA_INPUT_SLA_OUTPUT
  input_da:
    _target_: contrib.data_loading.data.open_glorys12_data_sst_normalized_climato_SLA_INPUT_SLA_OUTPUT
    path: ${paths.glorys12_data}
    masks_path: ${paths.masks_path}
    full_l4_path: ${paths.full_l4_path}
    sla_l3_path: ${paths.sla_l3_path}
    sla_l4_path: ${paths.sla_l4_path}
    domain: ${domain.train}
    masking: False
    time_domains: {_target_: builtins.slice, _args_: ['2010-01-01', '2019-12-30']}
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2010-01-01', '2018-12-31']}
    val:
      time: {_target_: builtins.slice, _args_: ['2019-01-01', '2019-12-30']}
    test:
      time: {_target_: builtins.slice, _args_: ['2019-12-31', '2019-12-30']}
  xrds_kw:
    patch_dims: {time: 29, lat: 641, lon: 1440}
    strides: {time: 1, lat: 633, lon: 1432}
    domain_limits: ${domain.train}
  dl_kw: {batch_size: 1, num_workers: 4}
  aug_kw:
    aug_factor: 1
    aug_only: False
  normalize_per_var: True
  norm_stats_per_var:
    input:     [0.101912, 0.467795]
    input_sla: [0.061926, 0.082705]
    tgt:       [0.101912, 0.467795]
    tgt_sla:   [0.056644, 0.051430]

model:
  _target_: contrib.forecast_plus.models_flow_matching.FlowMatchingGloFMForecastPatchGPU_SST_SLA_INOUT
  # ── No pretrained_ckpt_path: GloFM is unconditional ──
  n_inference_steps: 20    # Heun's method with MMPS — 20 steps is sufficient
  val_n_inference_steps: 20
  ema_decay: 0.999
  # MMPS observation noise (normalized space)
  # σ_y_sst: 0.4°C / 0.468 ≈ 0.85 but use 0.5 for tighter conditioning
  sigma_y_sst: 0.5
  # σ_y_sla: 0.03m / 0.051 ≈ 0.59 but use 0.3 for tighter conditioning
  sigma_y_sla: 0.3
  obs_lambda: 1.0          # MMPS correction strength
  persist_rw: False
  opt_fn:
    _target_: src.utils.cosanneal_lr_adam_flow_matching
    _partial_: true
    lr: 1e-4               # GloFM uses Adam lr=1e-5 → we start at 1e-4 with cosine decay
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: src.utils.get_forecast_wei
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  rec_weight_fn:
    _target_: contrib.forecast_weights.forecast_weights_reconstruction_soft_edges
    _partial_: True
    soft_edge: 0.25
  # Unconditional velocity UNet with self-attention at coarsest resolution
  velocity_net:
    _target_: src.models_flow_matching_uncond.FlowMatchingVelocityUNetUnconditional
    n_output_channels: 58   # 29 SST + 29 SLA
    bilinear: True
    time_dim: 256
    dropout: 0.1
    base_channels: 64
    attn_heads: 4
  pre_metric_fn:
    _target_: xarray.Dataset.sel
    _partial_: True
    time: {_target_: builtins.slice, _args_: ["2019-11-25", "2019-12-31"]}
    lat: ${domain.test.lat}
    lon: ${domain.test.lon}

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}

defaults:
  - _self_
