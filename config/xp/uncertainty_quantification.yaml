# @package _global_
#
# Uncertainty Quantification experiment config.
#
# Runs inference-time UQ on top of a pre-trained checkpoint.
# No retraining — only test_step is executed.
#
# Usage:
#   python main.py +xp=uncertainty_quantification
#
# To override individual UQ settings:
#   python main.py +xp=uncertainty_quantification uq.ope.n_members=50
#   python main.py +xp=uncertainty_quantification uq.modes=[ope,mcd,hessian]

paths:
  masks_path: /Odyssey/private/d21botvy/global_obs_6sats_masks_2019.pickle
  glorys12_data: /Odyssey/public/duacs/2019/from-copernicusmarine/duacs_2019_adt.nc
  duacs_data_path: /Odyssey/public/altimetry_traces/processed_2019_global_4/gridded/gridded_input.nc
  ckpt_path: /Odyssey/public/glorys/trainings/forecast_1patch_10y/base_forecast_global_softedge_fastrec_GPU_1patch_10y/checkpoints/val_mse=6.89547-epoch=072.ckpt

domain:
  train:
    lat: {_target_: builtins.slice, _args_: [-80, 90]}
    lon: {_target_: builtins.slice, _args_: [-180, 180]}
  test:
    lat: {_target_: builtins.slice, _args_: [-79, 89]}
    lon: {_target_: builtins.slice, _args_: [-179, 179]}

# UQ hyperparameters (mirrors config/params/uq_params.yaml defaults)
uq:
  modes: [ope, mcd]
  ope:
    n_members: 20
    obs_noise_std: 0.05
    perturb_missing: false
  mcd:
    n_samples: 30
  hessian:
    n_probes: 10
    eps: 1.0e-6
  conformal:
    alpha: 0.1
    score_type: normalized
  save_members: false

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: false       # must be False so autograd works inside solver
  accelerator: gpu
  devices: 1
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ${hydra:runtime.choices.xp}
    version: ''

datamodule:
  _target_: contrib.moving_patches.movpatch_data_tests.MovingPatchDataModuleFastRecGPU
  input_da:
    _target_: contrib.data_loading.data.open_glorys12_data_real_traces
    path: ${paths.duacs_data_path}
    path_glo12: ${paths.glorys12_data}
    masks_path: ${paths.masks_path}
    domain: ${domain.train}
    masking: false
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2019-01-01', '2019-05-17']}
    val:
      time: {_target_: builtins.slice, _args_: ['2019-05-18', '2019-11-24']}
    test:
      time: {_target_: builtins.slice, _args_: ['2019-11-25', '2019-12-31']}
  xrds_kw:
    patch_dims: {time: 29, lat: 680, lon: 1440}
    strides: {time: 1, lat: 672, lon: 1432}
    domain_limits: ${domain.train}
  dl_kw: {batch_size: 1, num_workers: 4}
  aug_kw:
    aug_factor: 1
    aug_only: true

# Base model (loaded from checkpoint, weights frozen)
base_model:
  _target_: contrib.forecast_plus.models.Plus4dVarNetForecastPatchGPU
  persist_rw: false
  opt_fn:
    _target_: src.utils.cosanneal_lr_adam
    _partial_: true
    lr: 1.0e-3
    T_max: 350
  rec_weight:
    _target_: src.utils.get_forecast_wei
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  rec_weight_fn:
    _target_: contrib.forecast_weights.forecast_weights_reconstruction_soft_edges
    _partial_: true
    soft_edge: 0.25
  solver:
    _target_: src.models.GradSolverZero
    n_step: 10
    lr_grad: 1.0e3
    prior_cost:
      _target_: src.models.BilinAEPriorCost
      dim_in: ${datamodule.xrds_kw.patch_dims.time}
      dim_hidden: 64
      bilin_quad: false
    obs_cost:
      _target_: src.models.BaseObsCost
    grad_mod:
      _target_: src.models.ConvLstmGradModel
      dim_in: ${datamodule.xrds_kw.patch_dims.time}
      dim_hidden: 96

# UQ wrapper (model field expected by entrypoints)
model:
  _target_: contrib.uncertainty.Lit4dVarNetUQ
  lit_model: ${base_model}
  uq_modes: ${uq.modes}
  ope_members: ${uq.ope.n_members}
  ope_noise_std: ${uq.ope.obs_noise_std}
  mcd_samples: ${uq.mcd.n_samples}
  hessian_probes: ${uq.hessian.n_probes}
  conformal_alpha: ${uq.conformal.alpha}
  conformal_score: ${uq.conformal.score_type}
  save_members: ${uq.save_members}

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: contrib.uncertainty.run_uq_inference
    trainer: ${trainer}
    lit_uq: ${model}
    dm: ${datamodule}
    ckpt: ${paths.ckpt_path}
    run_conformal_calibration: false   # set true to calibrate before test

defaults:
  - _self_
