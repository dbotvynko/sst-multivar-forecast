# @package _global_
#
# OSE reconstruction pipeline — GloFM Flow Matching SST+SLA forecast, year 2023.
#
# Usage:
#   python main.py xp=ose_pipeline_proc_2023_global_1patch_SST_SLA_INOUT_GLOFM \
#     paths.model_ckpt_path="/Odyssey/public/glorys/trainings/.../val_loss=X.XXXXX-epoch=XXX.ckpt"
#
# Model: FlowMatchingGloFMForecastPatchGPU_SST_SLA_INOUT
#   - GloFM logit-normal timestep + EMA + Heun ODE (50 steps)
#   - Condition: 29 SST obs + 29 SLA obs + 58 x_0 = 116 channels
#   - Input: past sparse SST L3 NRT + along-track SLA
#   - Output: stochastic ensemble member of future SST+SLA forecast

xp_name: glorys4_global_1patch_SST_SLA_INOUT_GLOFM_FM_logitnormal_ema_heun_OSE_2023
data_name: nrt_sst_sla_2023

paths:
  # ── SST input ─────────────────────────────────────────────────────────────
  ose_data_path: /Odyssey/public/ODYSSEA_IFREMER_SST/CLIMATO/SST-L3-NRT-2023-ANOMALY-FLAGGED-5-grid_sla_2023_nrt.nc

  # ── SLA input ─────────────────────────────────────────────────────────────
  sla_input_path: /Odyssey/public/altimetry_traces/nrt_sla/2023/gridded_input.nc

  # ── SLA reference for evaluation ──────────────────────────────────────────
  tgt_sla_path: /Odyssey/public/duacs/2023/duacs_2023_2024_0.25deg_float32.nc

  # ── Output directories ────────────────────────────────────────────────────
  rec_path: /Odyssey/public/glorys/rec/
  metrics_path: /Odyssey/public/glorys/metrics/

  # ── Model config and checkpoint ───────────────────────────────────────────
  model_config_path: config/xp/sst_training_flow_matching_glofm_SST_SLA_OSE_real_data_INFERENCE.yaml
  # Set this to your best GloFM checkpoint:
  model_ckpt_path: /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_SST_ODYSSEA_UNet_ResBlock_17M_2010_2019_FLOW_MATCHING_GLOFM_SST_SLA_INOUT_2gpu_logitnormal_ema_heun/sst_training_flow_matching_glofm_SST_SLA_OSE_real_data_2gpu/checkpoints/val_loss=1.35927-epoch=079.ckpt

specs:
  pixels_per_degree: 4

  min_time: 2023-01-01
  max_time: 2023-12-31
  time_day_crop: 0

  min_lon: -180
  max_lon: 180
  min_lat: -80
  max_lat: 80

  copernicus_dataset_id: cmems_obs-sl_glo_phy-ssh_nrt_{}-l3-duacs_PT1S
  input_satellites: ['al', 'c2n', 'h2b', 'j3n', 's3a', 's3b']
  ref_satellites: ['s6a-hr']

metrics_spatial_domains:
  GLOBE:
    lat:
      _target_: builtins.slice
      _args_: [-80, 80]
    lon:
      _target_: builtins.slice
      _args_: [-180, 180]
  GULFSTREAM:
    lat:
      _target_: builtins.slice
      _args_: [32, 42]
    lon:
      _target_: builtins.slice
      _args_: [-65, -55]
  GROENLAND:
    lat:
      _target_: builtins.slice
      _args_: [48, 58]
    lon:
      _target_: builtins.slice
      _args_: [-35, -25]
  MADERE:
    lat:
      _target_: builtins.slice
      _args_: [32, 42]
    lon:
      _target_: builtins.slice
      _args_: [-23, -13]

options:
  skip:
    data: True     # SST L3 NRT file already available at ose_data_path
    rec: False     # run inference
    metrics: True  # set to False to compute SST/SLA evaluation metrics

  overwrite:
    data: False
    rec: True
    metrics: False

# ── Hydra entrypoint ──────────────────────────────────────────────────────────
entrypoints:
  - _target_: contrib.ose_pipeline.ose_full_pipeline.execute_full_pipeline_SST_SLA_INOUT
    pixels_per_degree: ${specs.pixels_per_degree}
    min_time: ${specs.min_time}
    max_time: ${specs.max_time}
    min_lon: ${specs.min_lon}
    max_lon: ${specs.max_lon}
    min_lat: ${specs.min_lat}
    max_lat: ${specs.max_lat}
    metrics_spatial_domains: ${metrics_spatial_domains}
    time_day_crop: ${specs.time_day_crop}
    copernicus_dataset_id: ${specs.copernicus_dataset_id}
    input_satellites: ${specs.input_satellites}
    ref_satellites: ${specs.ref_satellites}
    ose_data_path: ${paths.ose_data_path}
    sla_input_path: ${paths.sla_input_path}
    tgt_sla_path: ${paths.tgt_sla_path}
    rec_path: ${paths.rec_path}
    metrics_path: ${paths.metrics_path}
    model_config_path: ${paths.model_config_path}
    model_ckpt_path: ${paths.model_ckpt_path}
    xp_name: ${xp_name}
    data_name: ${data_name}
    skip: ${options.skip}
    overwrite: ${options.overwrite}

defaults:
  - _self_
