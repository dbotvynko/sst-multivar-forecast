# @package _global_
#
# Flow matching refinement for SST+SLA forecast.
#
# Starts from the pre-trained deterministic SST+SLA model (frozen) and learns
# a velocity field to refine forecasts via conditional flow matching.
#
# Architecture:
#   - Frozen pre-trained UNet (29 SST + 29 SLA → 58 output channels)
#   - Trainable velocity UNet with time conditioning
#     Input:  x_t (58 ch) + condition (58 ch past obs) = 116 channels
#     Output: velocity (58 ch)
#
# Training: interpolate between deterministic forecast and ground truth,
#           predict velocity field, MSE loss.
# Inference: Euler ODE integration from deterministic forecast.

paths:
    masks_path: /Odyssey/public/glorys/obs_masks/global_obs_6sats_masks_2022.pickle
    glorys12_data: /Odyssey/public/ODYSSEA_IFREMER_SST/CLIMATO/SST-L3-NRT-2010_2019_NRT_ANOMALY_CLIMATO_f32_0.25deg_grid_sla_unfiltered.nc
    full_l4_path: /Odyssey/public/ODYSSEA_IFREMER_SST/L4/SST-L4-2010_2020_ANOMALY_CLIMATO_f32_0.25deg_pyresample_analysed_sst_grid_from_sla_unfiltered.nc
    sla_l3_path: /Odyssey/public/altimetry_traces/2010_2019/gridded_0.25deg/sla_unfiltered_0.25deg.nc
    sla_l4_path: /Odyssey/public/duacs/2010_2019/duacs_2010_2019_0.25deg_float32.nc
    ref_data_l4: ""
    ose_data_paths: ""
    # Pre-trained deterministic model checkpoint
    pretrained_ckpt_path: /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_SST_ODYSSEA_UNet_ResBlock_17M_2010_2019_SLA_INOUT_and_OUTPUT_OSE_real_data/sst_training_anomalyClimato_MSE_2010_2019_SLA_INOUT_OSE_real_data/checkpoints/val_mse=0.04409-epoch=342.ckpt

var_name: "sst_anomaly"
year_ose: 2023

domain:
  train:
    lat:
      _target_: builtins.slice
      _args_: [-80, 80]
    lon:
      _target_: builtins.slice
      _args_: [-180, 180]
  test:
    lat:
      _target_: builtins.slice
      _args_: [-80, 80]
    lon:
      _target_: builtins.slice
      _args_: [-180, 180]

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 2
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_SST_ODYSSEA_UNet_ResBlock_17M_2010_2019_FLOW_MATCHING_SST_SLA_INOUT_2gpu_x0cond
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 300
  limit_train_batches: 100
  callbacks:
    - _target_: src.versioning_cb.VersioningCallback
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_loss
      save_top_k: 10
      filename: '{val_loss:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.moving_patches.movpatch_data_tests.MovingPatchDataModuleFastRecGPU_SST_SLA_INPUT_SLA_OUTPUT
  input_da:
    _target_: contrib.data_loading.data.open_glorys12_data_sst_normalized_climato_SLA_INPUT_SLA_OUTPUT
    path: ${paths.glorys12_data}
    masks_path: ${paths.masks_path}
    full_l4_path: ${paths.full_l4_path}
    sla_l3_path: ${paths.sla_l3_path}
    sla_l4_path: ${paths.sla_l4_path}
    domain: ${domain.train}
    masking: False
    time_domains: {_target_: builtins.slice, _args_: ['2010-01-01', '2019-12-30']}
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2010-01-01', '2018-12-31']}
    val:
      time: {_target_: builtins.slice, _args_: ['2019-01-01', '2019-12-30']}
    test:
      time: {_target_: builtins.slice, _args_: ['2019-12-31', '2019-12-30']}
  xrds_kw:
    patch_dims: {time: 29, lat: 641, lon: 1440}
    strides: {time: 1, lat: 633, lon: 1432}
    domain_limits: ${domain.train}
  dl_kw: {batch_size: 1, num_workers: 4}
  aug_kw:
    aug_factor: 1
    aug_only: True
  normalize_per_var: True
  norm_stats_per_var:
    input:     [0.101912, 0.467795]
    input_sla: [0.061926, 0.082705]
    tgt:       [0.101912, 0.467795]
    tgt_sla:   [0.056644, 0.051430]

model:
  _target_: contrib.forecast_plus.models_flow_matching.FlowMatchingForecastPatchGPU_SST_SLA_INOUT
  pretrained_ckpt_path: ${paths.pretrained_ckpt_path}
  n_inference_steps: 1
  val_n_inference_steps: 5 #50
  persist_rw: False
  opt_fn:
    _target_: src.utils.cosanneal_lr_adam_flow_matching
    _partial_: true
    lr: 5e-4
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: src.utils.get_forecast_wei
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  rec_weight_fn:
    _target_: contrib.forecast_weights.forecast_weights_reconstruction_soft_edges
    _partial_: True
    soft_edge: 0.25
  # Frozen pre-trained deterministic model (same architecture as training)
  pretrained_model:
    _target_: contrib.forecast_plus.models.Plus4dVarNetForecastPatchGPU_UNet_SST_SLA_INPUT_SLA_OUTPUT
    persist_rw: False
    opt_fn:
      _target_: src.utils.cosanneal_lr_adam_UNet
      _partial_: true
      lr: 1e-3
      T_max: 500
    rec_weight:
      _target_: src.utils.get_forecast_wei
      patch_dims: ${datamodule.xrds_kw.patch_dims}
      crop: {time: 0, lat: 4, lon: 4}
    rec_weight_fn:
      _target_: contrib.forecast_weights.forecast_weights_reconstruction_soft_edges
      _partial_: True
      soft_edge: 0.25
    solver:
      _target_: src.models_UNet.UNet_SST_and_SLA_INPUT_SLA_OUTPUT
      n_channels: 29
      n_classes: 58
      bilinear: True
      block:
        _target_: src.parts.ResBlock
        _partial_: True
      add_input: False
    pre_metric_fn:
      _target_: xarray.Dataset.sel
      _partial_: True
      time: {_target_: builtins.slice, _args_: ["2019-11-25", "2019-12-31"]}
      lat: ${domain.test.lat}
      lon: ${domain.test.lon}
  # Trainable velocity network
  velocity_net:
    _target_: src.models_flow_matching.FlowMatchingVelocityUNet
    n_output_channels: 58   # 29 SST + 29 SLA
    n_cond_channels: 116    # 29 SST input + 29 SLA input + 58 deterministic forecast (x_0)
    bilinear: True
    time_dim: 256
  pre_metric_fn:
    _target_: xarray.Dataset.sel
    _partial_: True
    time: {_target_: builtins.slice, _args_: ["2019-11-25", "2019-12-31"]}
    lat: ${domain.test.lat}
    lon: ${domain.test.lon}

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}

defaults:
  - _self_
