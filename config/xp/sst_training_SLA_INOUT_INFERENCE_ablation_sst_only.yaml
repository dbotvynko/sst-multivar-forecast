# @package _global_
#
# Inference / reconstruction config for the SST+SLA INPUT → SST+SLA OUTPUT model.
# This file is consumed by the OSE reconstruction pipeline
# (ose_pipeline_proc_2023_global_1patch_SST_SLA_INOUT.yaml) via
# contrib.ose_pipeline.ose_rec_pipeline.setup_model_config_SST_SLA_INOUT.
#
# The pipeline will override:
#   - datamodule.input_da   (replaced with load_ose_data_with_tgt_mask_SST_SLA_INOUT)
#   - datamodule.domains    (adjusted to the inference period)
#   - model.output_leadtime_start
#   - model.pre_metric_fn.time
#
# All other fields (model architecture, patch dims, norm_stats, paths) must
# match those used during training.

paths:
    masks_path: /Odyssey/public/global_obs_odyssea_multisensor_no_flag_dt_v2.pickle
    glorys12_data: /Odyssey/public/glorys/reanalysis/SST-GLORYS12-2010_2019_ANOMALY_CLIMATO_f32_0.25deg.nc
    full_l4_path: /Odyssey/public/glorys/reanalysis/SST-GLORYS12-2010_2019_ANOMALY_CLIMATO_f32_0.25deg.nc
    ref_data_l4: ""
    ose_data_paths: ""
    # Paths below are overridden by the pipeline config at runtime:
    ose_gridded_input_path: ""

var_name: "sst_anomaly"
year_ose: 2023

domain:
  train:
    lat:
      _target_: builtins.slice
      _args_: [-80, 80]
    lon:
      _target_: builtins.slice
      _args_: [-180, 180]
  test:
    lat:
      _target_: builtins.slice
      _args_: [-80, 80]
    lon:
      _target_: builtins.slice
      _args_: [-180, 180]

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_SST_SLA_input_and_output_UNet_ResBlock_17M_2010_2019_AugTrue_MSE+GradLoss_OSSE
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 895
  limit_train_batches: 100
  callbacks:
    - _target_: src.versioning_cb.VersioningCallback
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_mse
      save_top_k: 10
      filename: '{val_mse:.5f}-{epoch:03d}'

datamodule:
  # _target_ and input_da are fully replaced at runtime by
  # setup_model_config_SST_SLA_INOUT; the values below are only used when
  # this config is loaded directly (e.g. for training).
  _target_: contrib.moving_patches.movpatch_data_tests.MovingPatchDataModuleFastRecGPU_SST_SLA_INPUT_SLA_OUTPUT
  input_da:
    _target_: contrib.data_loading.data.open_glorys12_data_sst_normalized_climato_SLA_INPUT_SLA_OUTPUT
    path: ${paths.glorys12_data}
    masks_path: ${paths.masks_path}
    full_l4_path: ${paths.full_l4_path}
    domain: ${domain.train}
    masking: False
    time_domains: {_target_: builtins.slice, _args_: ['2010-01-01', '2019-12-30']}
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2010-01-01', '2018-12-31']}
    val:
      time: {_target_: builtins.slice, _args_: ['2019-01-01', '2019-12-30']}
    test:
      time: {_target_: builtins.slice, _args_: ['2019-12-31', '2019-12-30']}
  xrds_kw:
    patch_dims: {time: 29, lat: 641, lon: 1440}
    strides: {time: 1, lat: 633, lon: 1432}
    domain_limits: ${domain.train}
  dl_kw: {batch_size: 1, num_workers: 4}
  aug_kw:
    aug_factor: 1
    aug_only: True
  normalize_per_var: True
  # Fill these values from norm_stats_per_var.json produced during training.
  # Example (replace with your actual values):
  #   python -c "import json; print(json.load(open('norm_stats_per_var.json')))"
  norm_stats_per_var:
    input:     [0.101912, 0.467795]
    input_sla: [0.061926, 0.082705]
    tgt:       [0.101912, 0.467795]
    tgt_sla:   [0.056644, 0.051430]

model:
  # Ablation: SST-only input (SLA zeroed out with NaN)
  _target_: contrib.forecast_plus.models.Plus4dVarNetForecastPatchGPU_UNet_SST_SLA_INOUT
  ablation_mode: sst_only
  persist_rw: False
  opt_fn:
    _target_: src.utils.cosanneal_lr_adam_UNet
    _partial_: true
    lr: 1e-3
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: src.utils.get_forecast_wei
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  rec_weight_fn:
    _target_: contrib.forecast_weights.forecast_weights_reconstruction_soft_edges
    _partial_: True
    soft_edge: 0.25
  solver:
    _target_: src.models_UNet.UNet_SST_and_SLA_INPUT_SLA_OUTPUT
    n_channels: 29   # 29 SST + 29 SLA timesteps concatenated in data loader
    n_classes: 58    # 29 SST output + 29 SLA output
    bilinear: True
    block:
      _target_: src.parts.ResBlock
      _partial_: True
    add_input: False
  pre_metric_fn:
    _target_: xarray.Dataset.sel
    _partial_: True
    time: {_target_: builtins.slice, _args_: ["2019-11-25", "2019-12-31"]}
    lat: ${domain.test.lat}
    lon: ${domain.test.lon}

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}

defaults:
  - _self_
