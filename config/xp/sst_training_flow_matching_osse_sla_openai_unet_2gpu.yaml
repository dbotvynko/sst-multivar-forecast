# @package _global_
#
# OSSE SLA Flow Matching — same as osse_sla_2gpu but uses the OpenAI guided-diffusion
# UNet as the velocity network instead of our custom FlowMatchingVelocityUNetAttn.
#
# Key difference:
#   velocity_net: OpenAIUNetVelocity (UNetModel with ResBlocks + QKV attention)
#     - FiLM-style scale-shift norm for timestep conditioning
#     - Spatial conditioning via channel-concatenation (x_tau || masked_SLA)
#     - in_channels = 29 (noisy) + 29 (condition) = 58
#     - out_channels = 29
#
# Everything else identical to sst_training_flow_matching_osse_sla_2gpu.

paths:
  glorys12_input: /Odyssey/public/glorys/reanalysis/glorys12_2010_2019_daily_sla_4th_input_gridded_alongtrack.nc
  glorys12_target: /Odyssey/public/glorys/reanalysis/glorys12_2010_2019_daily_sla_4th_target_gridded_alongtrack.nc

var_name: "sla_masked_osse"
year_ose: 2023

domain:
  train:
    lat:
      _target_: builtins.slice
      _args_: [-80, 90]
    lon:
      _target_: builtins.slice
      _args_: [-180, 180]
  test:
    lat:
      _target_: builtins.slice
      _args_: [-79, 89]
    lon:
      _target_: builtins.slice
      _args_: [-179, 179]

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 2
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_SLA_FM_OSSE_OpenAIUNet_2gpu_logitnormal_ema_heun
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 300
  limit_train_batches: 500
  callbacks:
    - _target_: src.versioning_cb.VersioningCallback
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_mse
      save_top_k: 10
      filename: '{val_mse:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.moving_patches.movpatch_data_tests.MovingPatchDataModuleFastRecGPU
  input_da:
    _target_: contrib.data_loading.data.open_glorys12_data_sla_premasked
    input_path: ${paths.glorys12_input}
    tgt_path: ${paths.glorys12_target}
    domain: ${domain.train}
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2010-01-01', '2019-05-17']}
    val:
      time: {_target_: builtins.slice, _args_: ['2019-05-18', '2019-12-31']}
    test:
      time: {_target_: builtins.slice, _args_: ['2019-12-31', '2019-12-31']}
  xrds_kw:
    patch_dims: {time: 29, lat: 680, lon: 1440}
    strides: {time: 1, lat: 672, lon: 1432}
    domain_limits: ${domain.train}
  dl_kw: {batch_size: 1, num_workers: 4}
  aug_kw:
    aug_factor: 1
    aug_only: True

model:
  _target_: contrib.forecast_plus.models_flow_matching.FlowMatchingOSSEForecastPatchGPU_SLA
  sigma_prior: 1.0
  n_inference_steps: 50
  val_n_inference_steps: 50
  ema_decay: 0.999
  persist_rw: False
  output_leadtime_start: 0
  opt_fn:
    _target_: src.utils.cosanneal_lr_adam_flow_matching
    _partial_: true
    lr: 1e-4
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: src.utils.get_forecast_wei
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  rec_weight_fn:
    _target_: contrib.forecast_weights.forecast_weights_reconstruction_soft_edges
    _partial_: True
    soft_edge: 0.25
  velocity_net:
    _target_: src.models_openai_unet.OpenAIUNetVelocity
    n_output_channels: 29
    n_cond_channels: 29          # masked SLA concatenated to noisy input
    model_channels: 128
    num_res_blocks: 2
    attention_resolutions: [8, 16]   # attention at 1/8 and 1/16 downsampling
    channel_mult: [1, 2, 4, 8]
    num_heads: 4
    dropout: 0.1
    use_scale_shift_norm: True       # FiLM timestep conditioning
    use_checkpoint: False
  pre_metric_fn:
    _target_: xarray.Dataset.sel
    _partial_: True
    time: {_target_: builtins.slice, _args_: ["2019-11-25", "2019-12-31"]}
    lat: ${domain.test.lat}
    lon: ${domain.test.lon}

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}

defaults:
  - _self_
