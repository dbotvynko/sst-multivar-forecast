# @package _global_
#
# OSE reconstruction pipeline — SST+SLA INPUT → SST+SLA OUTPUT, year 2023.
#
# Usage:
#   python main.py xp=ose_pipeline_proc_2023_global_1patch_SST_SLA_INOUT
#
# What this does:
#   skip.data  = True  → SST L3 NRT data is already available as a .nc file
#                         (ose_data_path must point directly to it)
#   skip.rec   = False → runs inference with the trained SST+SLA UNet model
#   skip.metrics= True → skip altimetry-based SSH metrics (not applicable for
#                         SST forecast; set to False and adapt out_var to enable)
#
# Output per leadtime i ∈ [output_leadtime_start, 6]:
#   rec_path/xp_name/data_name/test_data_{14+i}.nc
#   Variables in each file: 'sst' (SST anomaly forecast) and 'sla' (SLA forecast)

xp_name: glorys4_global_1patch_SST_SLA_INOUT_UNet_ResBlock_2010_2019_MSEGradLoss_perVarNorm_anotherCKPT_N2
data_name: nrt_sst_sla_2023

paths:
  # ── SST input ─────────────────────────────────────────────────────────────
  # Pre-gridded SST L3 NRT anomaly file (same format as used in training).
  # If this path ends with .nc and the file exists it is used directly as
  # gridded_input; otherwise a gridded_input.nc is expected in ose_data_path/.
  ose_data_path: /Odyssey/public/ODYSSEA_IFREMER_SST/CLIMATO/SST-L3-NRT-2023-ANOMALY-FLAGGED-5-grid_sla_2023_nrt.nc

  # ── SLA input for the model (along-track gridded) ─────────────────────────
  # File with along-track SLA observations re-gridded to 0.25°.
  # Must contain a variable named 'sla_unfiltered' (or the first variable is
  # used as fallback).  This is the same file used as input_sla during training.
  sla_input_path: /Odyssey/public/altimetry_traces/nrt_sla/2023/gridded_input.nc

  # ── SLA reference for output evaluation ───────────────────────────────────
  # L4 SLA reference product used as tgt_sla during inference metrics.
  # Variable priority: 'zos' > 'sla' > first variable.
  tgt_sla_path: /Odyssey/public/duacs/2023/duacs_2023_2024_0.25deg_float32.nc

  # ── Reconstruction and metrics output directories ─────────────────────────
  rec_path: /Odyssey/public/glorys/rec/
  metrics_path: /Odyssey/public/glorys/metrics/

  # ── Model config and checkpoint ───────────────────────────────────────────
  model_config_path: config/xp/sst_training_anomalyClimato_MSE_2016_2019_SLA_INOUT_SLA_and_SST_OUTPUTS_INFERENCE.yaml
  # Point this to the best checkpoint from your SST+SLA INOUT training run:
  model_ckpt_path: /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_SST_SLA_input_and_output_UNet_ResBlock_17M_2010_2019_AugTrue_MSE+GradLoss_OSSE_perVarNorm/sst_training_anomalyClimato_MSE_2016_2019_SLA_INOUT_SLA_and_SST_OUTPUTS_perVarNorm/checkpoints/val_mse=0.05550-epoch=338.ckpt
    #val_mse=0.06529-epoch=077.ckpt

specs:
  pixels_per_degree: 4

  min_time: 2023-01-01
  max_time: 2023-12-31
  time_day_crop: 0

  min_lon: -180
  max_lon: 180
  min_lat: -80
  max_lat: 80

  copernicus_dataset_id: cmems_obs-sl_glo_phy-ssh_nrt_{}-l3-duacs_PT1S
  input_satellites: ['al', 'c2n', 'h2b', 'j3n', 's3a', 's3b']
  ref_satellites: ['s6a-hr']

metrics_spatial_domains:
  GLOBE:
    lat:
      _target_: builtins.slice
      _args_: [-80, 80]
    lon:
      _target_: builtins.slice
      _args_: [-180, 180]
  GULFSTREAM:
    lat:
      _target_: builtins.slice
      _args_: [32, 42]
    lon:
      _target_: builtins.slice
      _args_: [-65, -55]
  GROENLAND:
    lat:
      _target_: builtins.slice
      _args_: [48, 58]
    lon:
      _target_: builtins.slice
      _args_: [-35, -25]
  MADERE:
    lat:
      _target_: builtins.slice
      _args_: [32, 42]
    lon:
      _target_: builtins.slice
      _args_: [-23, -13]

options:
  skip:
    data: True     # SST L3 NRT file already available at ose_data_path
    rec: False     # run inference
    metrics: True  # set to False to compute SST/SLA evaluation metrics

  overwrite:
    data: False
    rec: True      # re-run reconstruction even if output files already exist
    metrics: False

# ── Hydra entrypoint — do not modify ──────────────────────────────────────────
entrypoints:
  - _target_: contrib.ose_pipeline.ose_full_pipeline.execute_full_pipeline_SST_SLA_INOUT
    pixels_per_degree: ${specs.pixels_per_degree}
    min_time: ${specs.min_time}
    max_time: ${specs.max_time}
    min_lon: ${specs.min_lon}
    max_lon: ${specs.max_lon}
    min_lat: ${specs.min_lat}
    max_lat: ${specs.max_lat}
    metrics_spatial_domains: ${metrics_spatial_domains}
    time_day_crop: ${specs.time_day_crop}
    copernicus_dataset_id: ${specs.copernicus_dataset_id}
    input_satellites: ${specs.input_satellites}
    ref_satellites: ${specs.ref_satellites}
    ose_data_path: ${paths.ose_data_path}
    sla_input_path: ${paths.sla_input_path}
    tgt_sla_path: ${paths.tgt_sla_path}
    rec_path: ${paths.rec_path}
    metrics_path: ${paths.metrics_path}
    model_config_path: ${paths.model_config_path}
    model_ckpt_path: ${paths.model_ckpt_path}
    xp_name: ${xp_name}
    data_name: ${data_name}
    skip: ${options.skip}
    overwrite: ${options.overwrite}

defaults:
  - _self_
